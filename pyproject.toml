[project]
name = "bi"
version = "0.1.0"
description = "Proyecto integrador de Inteligencia de Negocios"
requires-python = ">=3.12"
dependencies = ["duckdb", "pandas", "numpy", "scikit-learn", "matplotlib"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bi"]
